<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周汇报统计 | 11.7 - 11.13</title>
<style>
  :root {
    --bg: #151719;
    --card-bg: #1f2022;
    --text-main: #ffffff;
    --text-muted: #8b94a1;
    --accent: #faee00;
    --border: rgba(255, 255, 255, 0.1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(250, 238, 0, 0.05), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(250, 238, 0, 0.03), transparent 25%);
  }

  .dashboard {
    width: 100%;
    max-width: 900px;
    background: rgba(31, 32, 34, 0.6);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
    backdrop-filter: blur(20px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 40px;
  }

  .header-left h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-left h1::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 24px;
    background-color: var(--accent);
    border-radius: 4px;
  }

  .header-left p {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 8px;
    margin-left: 20px;
  }

  .date-range {
    background: rgba(250, 238, 0, 0.1);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 700;
    border: 1px solid rgba(250, 238, 0, 0.2);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  .stat-card {
    background: linear-gradient(145deg, #1f2022, #181a1c);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .stat-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
    border-color: rgba(250, 238, 0, 0.3);
  }

  .stat-card::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s ease;
  }

  .stat-card:hover::after {
    transform: scaleX(1);
  }

  .stat-label {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stat-label svg {
    width: 18px;
    height: 18px;
    fill: var(--text-muted);
  }

  .stat-value {
    font-size: 64px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2px;
    color: #fff;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .stat-value span {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0;
  }

  /* 预期卡片特殊样式 */
  .stat-card.forecast {
    border-color: rgba(250, 238, 0, 0.3);
    background: linear-gradient(145deg, rgba(250, 238, 0, 0.05), #181a1c);
  }
  
  .stat-card.forecast .stat-value {
    color: var(--accent);
  }
  
  .stat-card.forecast .stat-label {
    color: #d1d5db;
  }

  @media (max-width: 768px) {
    .dashboard {
      padding: 24px;
    }
    .header {
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }
    .stats-grid {
      grid-template-columns: 1fr;
    }
    .stat-value {
      font-size: 48px;
    }
  }
</style>
</head>
<body>

  <div class="dashboard">
    <div class="header">
      <div class="header-left">
        <h1>周度数据汇报</h1>
        <p>核心数据总览（不细分渠道）</p>
      </div>
      <div class="date-range">
        11.7 - 11.13
      </div>
    </div>

    <div class="stats-grid">
      <!-- 本周数据 -->
      <div class="stat-card">
        <div class="stat-label">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
          本周注册总数
        </div>
        <div class="stat-value">
          6 <span>人</span>
        </div>
      </div>

      <!-- 下周预计数据 -->
      <div class="stat-card forecast">
        <div class="stat-label">
          <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
          预计下周注册总数
        </div>
        <!-- ⚠️ 这里把数字改成了 10，你可以直接在代码里改成你想要预测的数字 -->
        <div class="stat-value">
          10 <span>人</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
