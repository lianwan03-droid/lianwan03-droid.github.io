<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容运营周报 · 数据版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#111827;--ink2:#5b6472;--ink3:#94a3b8;
  --line:#e9edf2;--brand:#4f46e5;--green:#10b981;--amber:#f59e0b;--sky:#0ea5e9;--red:#ef4444;
  --radius:16px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;padding:28px 18px 72px;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* Hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(130deg,#1e293b,#0f172a 55%,#241f4f);
  color:#fff;border-radius:22px;padding:34px 34px 30px}
.hero::after{content:"";position:absolute;width:340px;height:340px;right:-100px;top:-130px;border-radius:50%;
  background:radial-gradient(circle,rgba(99,102,241,.55),transparent 68%)}
.hero>*{position:relative;z-index:1}
.hero-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;font-weight:600;
  color:#a5b4fc;text-transform:uppercase}
.hero-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:#818cf8;box-shadow:0 0 0 4px rgba(129,140,248,.2)}
.hero h1{font-size:30px;line-height:1.25;margin:10px 0 8px;font-weight:700;letter-spacing:-.01em}
.hero-sub{color:#cbd5e1;font-size:15px;max-width:720px}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.hero-meta span{font-size:13px;color:#e2e8f0;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 14px}

/* KPI：6 张卡，尺寸适中 */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:var(--card);border-radius:14px;padding:16px 15px;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--brand))}
.kpi-label{font-size:12px;color:var(--ink2);font-weight:500;white-space:nowrap}
.kpi-value{font-size:26px;font-weight:700;line-height:1.15;margin:5px 0 3px;letter-spacing:-.02em}
.kpi-value small{font-size:12.5px;font-weight:600;color:var(--ink2);margin-left:2px}
.kpi-note{font-size:11.5px;color:var(--ink3);line-height:1.45}
.kpi.muted .kpi-value{color:#64748b}
.kpi.form-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.kpi.form-row .chip{font-size:10.5px;padding:1px 7px}
.chip{display:inline-flex;align-items:center;font-size:11.5px;padding:2px 9px;border-radius:999px;
  background:#f1f5f9;color:#475569;white-space:nowrap;font-weight:500}
.chip.blue{background:#eef2ff;color:#4f46e5}
.chip.green{background:#ecfdf5;color:#059669}
.chip.amber{background:#fffbeb;color:#b45309}
.chip.sky{background:#e0f2fe;color:#0369a1}

/* Card */
.card{background:var(--card);border-radius:var(--radius);padding:24px 26px;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.card-head h2{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:9px}
.card-head h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--brand)}
.card-head .hint{font-size:12.5px;color:var(--ink3);text-align:right}

/* 主表 */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.main{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px;font-size:13px}
table.main th{background:#fafbfc;color:var(--ink2);font-weight:600;font-size:12px;padding:11px 10px;
  text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2}
table.main td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
table.main tbody tr:last-child td{border-bottom:none}
table.main tbody tr:hover td{background:#fbfcfe}
td.t-left,th.t-left{text-align:left}
td.plat{font-weight:700;white-space:nowrap;border-left:4px solid var(--pc,#4f46e5);background:#fcfcfe}
td.acc{white-space:nowrap;font-weight:500;color:var(--ink2)}
td.content{text-align:left;min-width:250px;font-weight:500;line-height:1.5}
td.num{font-variant-numeric:tabular-nums;font-weight:600}
td.strong{font-weight:700;color:var(--brand)}
.form-tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:#eef2ff;color:#4f46e5;font-weight:600}
.form-tag.v{background:#e0f2fe;color:#0369a1}
.tbl-note{font-size:12px;color:var(--ink3);margin-top:12px;line-height:1.8}

/* 图表 */
.chart-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;justify-content:center;gap:20px;margin-top:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* 洞察：框架内紧凑展示 */
.insights-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.insight-item{background:#fafbfc;border:1px solid var(--line);border-left:3px solid var(--ic,#4f46e5);
  border-radius:10px;padding:14px 16px}
.insight-item h4{font-size:13.5px;font-weight:700;margin-bottom:5px;line-height:1.45}
.insight-item p{font-size:12.8px;color:var(--ink2);line-height:1.65}
.insight-item.lv-r{--ic:#ef4444}
.insight-item.lv-g{--ic:#10b981}
.insight-item.lv-b{--ic:#4f46e5}
.insight-item.lv-a{--ic:#f59e0b}

/* 总结 */
.summary p{font-size:14px;color:var(--ink2);line-height:1.95;margin-bottom:14px}
.summary p:last-child{margin-bottom:0}
.summary p strong{color:var(--ink);font-weight:600}

/* 时间线 */
.tl-day{display:flex;gap:16px;position:relative;padding-bottom:20px}
.tl-day:last-child{padding-bottom:0}
.tl-day:not(:last-child)::before{content:"";position:absolute;left:19px;top:44px;bottom:2px;width:2px;background:var(--line)}
.tl-marker{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#eef2ff;
  color:var(--brand);font-weight:700;font-size:14px;border:1px solid #e0e7ff}
.tl-body{flex:1;min-width:0;padding-top:3px}
.tl-head{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.tl-head h3{font-size:15px;font-weight:700}
.tl-head .count{font-size:12px;color:var(--ink3)}
.tl-items{display:flex;flex-direction:column;gap:9px}
.tl-item{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;background:#fafbfc;
  border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tl-item-title{font-size:14px;font-weight:600;margin-bottom:2px}
.tl-item-desc{font-size:13px;color:var(--ink2)}
.tl-item-tags{display:flex;flex-wrap:wrap;gap:6px;flex:0 0 auto;justify-content:flex-end}

/* 下周计划 */
.plan{display:flex;flex-direction:column;gap:11px}
.plan-row{display:flex;gap:12px;align-items:flex-start;background:#fafbfc;border:1px solid var(--line);
  border-radius:12px;padding:12px 14px}
.plan-day{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#eef2ff;
  color:var(--brand);font-weight:700;font-size:13px;border:1px solid #e0e7ff}
.plan-body{flex:1;min-width:0}
.plan-title{font-size:14px;font-weight:600;margin-bottom:2px}
.plan-desc{font-size:13px;color:var(--ink2)}

/* 转化预估（优化版） */
.conv-overview{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px}
.conv-box{background:#fafbfc;border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;position:relative;overflow:hidden}
.conv-box.actual{border-left:4px solid var(--brand)}
.conv-box.forecast{border-left:4px solid var(--amber)}
.conv-title{font-size:14px;color:var(--ink2);font-weight:600;margin-bottom:10px}
.conv-number{font-size:42px;font-weight:800;color:var(--ink);line-height:1}
.conv-box.actual .conv-number{color:var(--brand)}
.conv-box.forecast .conv-number{color:var(--amber)}
.conv-number span{font-size:16px;font-weight:600;color:var(--ink2);margin-left:4px}
.conv-note{font-size:12.5px;color:var(--ink3);margin-top:12px;line-height:1.8}

.foot{font-size:12.5px;color:var(--ink3);text-align:center;padding-top:4px;line-height:1.9}

@media(max-width:1080px){
  .kpis{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:980px){
  .chart-grid{grid-template-columns:1fr}
  .insights-grid{grid-template-columns:1fr}
  .conv-overview{grid-template-columns:1fr}
}
@media(max-width:860px){.hero{padding:28px 24px 26px}.hero h1{font-size:24px}}
@media(max-width:560px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .tl-item{flex-direction:column;gap:8px}
  .tl-item-tags{justify-content:flex-start}
  .kpi-value{font-size:24px}
}
</style>
</head>

  <section class="card">

  <section class="card">

    </div>
    <div id="timeline"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>本周总结</h2></div>
    <div class="summary" id="summary"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>下周计划</h2>
      <span class="hint">周一 — 周五</span>
    </div>
    <div class="plan" id="plan"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>转化数据统计</h2>

    <div class="conv-overview" id="convOverview"></div>
    <p class="conv-note" id="convNote"></p>
  </section>

  <footer class="foot" id="foot"></footer>
</div>

(function renderTable(){
  const rows = DATA.table;
  const groups = {};
  rows.forEach(r => { (groups[r.platform] = groups[r.platform] || []).push(r); });

  const head = `
    <thead>

        <th class="t-left">平台</th>

  let body = "<tbody>";

      body += `<td><span class="form-tag ${r.form === "视频" ? "v" : ""}">${r.form}</span></td>`;
      body += `<td class="num">${r.exposure}</td>`;
      body += `<td class="num strong">${r.views}</td>`;
      body += `<td class="num">${r.ctr}</td>`;
      body += `<td class="num">${r.dur}</td>`;
      body += `<td class="num">${r.comp}</td>`;
      body += `<td class="num">${r.like}</td>`;
      body += `<td class="num">${r.comment}</td>`;
      body += `<td class="num">${r.share}</td>`;
      body += `<td class="num">${r.collect}</td>`;
      body += `<td class="num">${r.follow}</td>`;

  document.getElementById("mainTable").innerHTML = `<table class="main">${head}${body}</table>`;

/* 横向条形图 */
(function barChart(){
  const data = DATA.barData;
  const rowH = 42, padL = 210, padR = 70, padT = 10, padB = 10;
  const W = 620, H = padT + padB + data.length * rowH;
  const max = Math.max(...data.map(d => d.value));
  const iw = W - padL - padR;

  let out = "";
  data.forEach((d, i) => {
    const y = padT + i * rowH;
    const w = Math.max((d.value / max) * iw, 3);
    out += `
      <text x="${padL - 12}" y="${y + 20}" text-anchor="end"
            style="font-size:12.5px;fill:#475569">${d.label}</text>
      <rect x="${padL}" y="${y + 8}" width="${w}" height="20" rx="6" fill="${d.color}" opacity=".88"/>
      <text x="${padL + w + 10}" y="${y + 22}"
            style="font-size:12.5px;font-weight:700;fill:#334155">${d.value.toLocaleString()}</text>`;
  });

  document.getElementById("chartBar").innerHTML =
    `<svg class="chart" viewBox="0 0 ${W} ${H}">${out}</svg>`;
})();

/* 留存曲线 */
(function retentionChart(){
  const { seconds, main, sub } = DATA.retention;
  const W = 560, H = 320, pad = { t: 22, r: 26, b: 48, l: 46 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const maxX = seconds[seconds.length - 1];

  const X = s => pad.l + (s / maxX) * iw;
  const Y = v => pad.t + ih - (v / 100) * ih;

  let grid = "";
  [0, 25, 50, 75, 100].forEach(v => {
    grid += `<line x1="${pad.l}" y1="${Y(v)}" x2="${W - pad.r}" y2="${Y(v)}" stroke="#eef1f5"/>`;
    grid += `<text x="${pad.l - 10}" y="${Y(v) + 4}" text-anchor="end"
             style="font-size:11.5px;fill:#94a3b8">${v}%</text>`;
  });
  [0, 15, 30, 45, 60].forEach(s => {
    grid += `<text x="${X(s)}" y="${H - pad.b + 22}" text-anchor="middle"
             style="font-size:11.5px;fill:#94a3b8">${s}s</text>`;
  });

  const path = arr => arr.map((v, i) => `${i ? "L" : "M"}${X(seconds[i])},${Y(v)}`).join(" ");

  document.getElementById("chartRetention").innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}">
    ${grid}
    <path d="${path(main)}" fill="none" stroke="#4f46e5" stroke-width="2.4"
          stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${path(sub)}" fill="none" stroke="#0ea5e9" stroke-width="2.4"
          stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/>
    <circle cx="${X(0)}" cy="${Y(100)}" r="4" fill="#4f46e5"/>
  </svg>`;
})();

/* 抖音流量来源 */
(function trafficChart(){
  const { labels, main, sub } = DATA.traffic;
  const W = 560, rowH = 46, padL = 86, padR = 56, padT = 12, padB = 12;
  const H = padT + padB + labels.length * rowH;
  const max = Math.max(...main, ...sub, 1);
  const iw = W - padL - padR;

  let out = "";
  labels.forEach((lb, i) => {
    const y = padT + i * rowH;
    const w1 = Math.max((main[i] / max) * iw, main[i] > 0 ? 3 : 0);
    const w2 = Math.max((sub[i] / max) * iw, sub[i] > 0 ? 3 : 0);
    out += `
      <text x="${padL - 12}" y="${y + 27}" text-anchor="end"
            style="font-size:12.5px;fill:#475569">${lb}</text>
      <rect x="${padL}" y="${y + 6}" width="${w1}" height="13" rx="4" fill="#4f46e5" opacity=".9"/>
      <text x="${padL + w1 + 8}" y="${y + 17}"
            style="font-size:11.5px;font-weight:700;fill:#4f46e5">${main[i]}%</text>
      <rect x="${padL}" y="${y + 23}" width="${w2}" height="13" rx="4" fill="#0ea5e9" opacity=".9"/>
      <text x="${padL + w2 + 8}" y="${y + 34}"
            style="font-size:11.5px;font-weight:700;fill:#0ea5e9">${sub[i]}%</text>`;
  });

  document.getElementById("chartTraffic").innerHTML =
    `<svg class="chart" viewBox="0 0 ${W} ${H}">${out}</svg>
     <div class="legend">
       <span><i style="background:#4f46e5"></i>抖音主号</span>
       <span><i style="background:#0ea5e9"></i>抖音小号</span>
     </div>`;
})();

/* 公众号画像 */
(function audienceChart(){
  const groups = DATA.audience;
  const W = 520, padL = 88, padR = 56, padT = 8;
  const rowH = 30, groupGap = 20;

  let H = padT;
  groups.forEach(g => { H += g.items.length * rowH + groupGap; });

  const iw = W - padL - padR;
  let out = "", y = padT;

  groups.forEach(g => {
    out += `<text x="0" y="${y + 15}" style="font-size:12px;font-weight:700;fill:#4f46e5">${g.group}</text>`;
    y += 8;
    const max = Math.max(...g.items.map(i => i[1]));
    g.items.forEach(([label, val]) => {
      const w = Math.max((val / max) * iw, 3);
      out += `
        <text x="${padL - 10}" y="${y + 18}" text-anchor="end"
              style="font-size:12px;fill:#475569">${label}</text>
        <rect x="${padL}" y="${y + 7}" width="${w}" height="15" rx="5" fill="#a5b4fc"/>
        <text x="${padL + w + 8}" y="${y + 19}"
              style="font-size:11.5px;font-weight:700;fill:#334155">${val}%</text>`;
      y += rowH;
    });
    y += groupGap - 8;
  });

  document.getElementById("chartAudience").innerHTML =
    `<svg class="chart" viewBox="0 0 ${W} ${H}">${out}</svg>`;
})();
